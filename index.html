<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Личный список задач с сохранением в браузере. Без регистрации." />
    <meta name="theme-color" content="#f8fbff" />
    <title>Планы на день — список задач</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237042d9'/%3E%3Cpath d='m17 32 10 10 20-21' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;650;700;750;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <noscript><p class="no-script">Для работы списка задач включите JavaScript в браузере.</p></noscript>
    <main class="app-shell">
      <header class="hero">
        <h1>Планы на день</h1>
      </header>

      <section class="task-card" aria-labelledby="tasks-heading">
        <div class="card-heading">
          <h2 id="tasks-heading">Список дел</h2>
        </div>
        <form class="task-form" id="task-form">
          <label class="sr-only" for="task-input">Название новой задачи</label>
          <input id="task-input" name="task" type="text" placeholder="Например, отправить тестовое" autocomplete="off" aria-describedby="input-error" />
          <button class="add-button" type="submit"><span aria-hidden="true">+</span> Добавить</button>
        </form>
        <p class="input-error" id="input-error" role="alert"></p>

        <div class="toolbar">
          <div class="filters" role="group" aria-label="Показать задачи">
            <button class="filter is-active" type="button" data-filter="all" aria-pressed="true" aria-controls="task-list">Все <span id="all-count">0</span></button>
            <button class="filter" type="button" data-filter="active" aria-pressed="false" aria-controls="task-list">В работе <span id="active-count">0</span></button>
            <button class="filter" type="button" data-filter="completed" aria-pressed="false" aria-controls="task-list">Готово <span id="completed-count">0</span></button>
          </div>
          <button class="clear-button" id="clear-completed" type="button" disabled>Удалить готовые</button>
        </div>

        <div class="sr-only" id="task-status" role="status" aria-atomic="true"></div>
        <div class="undo-toast" id="undo-toast" hidden>
          <span id="undo-message" role="status" aria-live="polite">Задача удалена.</span>
          <button class="undo-button" id="undo-delete" type="button">Отменить</button>
        </div>
        <ul class="task-list" id="task-list" aria-label="Задачи"></ul>
        <div class="empty-state" id="empty-state">
          <svg class="empty-illustration" viewBox="0 0 100 100" fill="none" aria-hidden="true">
            <rect x="24" y="13" width="57" height="75" rx="5" fill="#e5d5fa" transform="rotate(9 24 13)" />
            <rect x="18" y="10" width="57" height="75" rx="5" fill="#fdfaff" stroke="currentColor" stroke-width="1.5" />
            <path d="m28 32 3 3 6-7M43 32h20M28 48h7M43 48h20M28 64h7M43 64h13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <h3 id="empty-title">Начните с одной задачи</h3>
          <p id="empty-copy">Запишите её в поле выше и нажмите «Добавить».</p>
        </div>
        <section class="progress-panel" id="progress-panel" aria-labelledby="progress-heading">
          <div class="progress-copy"><h3 id="progress-heading">Прогресс</h3><span id="progress-label">0 из 0 · 0%</span></div>
          <div class="progress-track" id="progress-track" role="progressbar" aria-label="Выполненные задачи" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-fill"></span></div>
        </section>
        <footer class="card-footer">
          <span class="keyboard-hint"><kbd>Enter</kbd> — добавить</span>
          <span id="storage-status" role="status" aria-live="polite" aria-atomic="true">Хранение в этом браузере</span>
        </footer>
      </section>
      <p class="privacy-note">Задачи не теряются после обновления страницы.</p>
    </main>
  </body>
</html>
